<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>radinkacraft – Bucket Bunga</title>
<meta name="description" content="Bucket tulip segar untuk hari istimewa. Pesan online, dikirim rapi ke pintu penerima.">
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4a5b3; --bg2:#f8bcc6; --panel:#f9c4cd; --ink:#7a2e3f; --muted:#8a5560;
  --pink:#ec5b8c; --orange:#f79a7c; --white:#fff;
  --serif:"Playfair Display",Georgia,serif; --display:"Abril Fatface","Playfair Display",Georgia,serif;
  --sans:"DM Sans",system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#f4a5b3}}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:radial-gradient(circle at 30% 20%,var(--bg2),var(--bg));min-height:100vh;font-family:var(--sans);color:var(--ink);display:grid;place-items:center;padding:24px 16px;overflow-x:hidden}
.stage{position:relative;width:100%;max-width:1040px}
.card{position:relative;background:linear-gradient(135deg,#fbcfd6,#f8bfc9);border-radius:2px;box-shadow:0 40px 60px -20px rgba(150,50,80,.35);padding:22px 44px 60px;min-height:520px;overflow:visible}
nav{display:flex;align-items:center;gap:28px;font-size:11px;color:var(--muted)}
.logo{font-family:var(--serif);font-weight:700;font-size:16px;color:var(--pink);margin-right:auto;display:flex;align-items:center;gap:4px}
.logo i{width:12px;height:12px;background:var(--pink);border-radius:50% 50% 50% 0;display:inline-block;transform:rotate(-45deg)}
nav a{color:inherit;text-decoration:none}
nav a:hover,nav a:focus-visible{color:var(--ink);outline:none;text-decoration:underline}
.cart{position:relative;width:16px;height:16px;border:1.5px solid var(--muted);border-radius:2px}
.cart b{position:absolute;top:-6px;right:-7px;width:8px;height:8px;background:var(--pink);border-radius:50%}
.burger{width:14px;height:10px;border-top:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);position:relative}
.burger:after{content:"";position:absolute;left:0;right:0;top:3.5px;border-top:1.5px solid var(--muted)}
.hero{display:grid;grid-template-columns:1fr 1fr;align-items:center;margin-top:8px}
.art{position:relative;height:440px;margin-top:-40px;margin-left:-30px}
.art .bq{position:absolute;left:10px;bottom:-62px;height:500px;width:auto;filter:drop-shadow(0 14px 16px rgba(150,50,80,.28))}
.date{position:absolute;left:-8px;top:150px;font-family:var(--display);color:#fff;line-height:.82;font-size:clamp(64px,9vw,104px);letter-spacing:-.01em;text-shadow:0 2px 14px rgba(150,50,80,.18);pointer-events:none}
.date sup{font-size:.42em;vertical-align:top;margin-left:.04em;position:relative;top:.16em}
.date span{display:block;margin-top:.02em}
.copy{padding-left:24px}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(28px,3.6vw,38px);line-height:1.08;color:var(--ink);max-width:14ch}
.copy p{margin-top:22px;font-size:11px;line-height:1.7;color:var(--muted);max-width:44ch}
.sizes{display:flex;gap:6px;margin-top:20px}
.sizes button{font:inherit;font-size:10px;color:var(--muted);background:none;border:0;border-radius:50%;width:26px;height:26px;cursor:pointer}
.sizes button[aria-pressed="true"]{background:rgba(255,255,255,.55);color:var(--ink)}
.sizes button:focus-visible,.buy:focus-visible,.down:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.buybar{margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 18px;background:rgba(255,255,255,.28);border-radius:6px;max-width:340px}
.price{font-family:var(--display);color:#fff;font-size:26px;white-space:nowrap}
.price small{font-size:.5em;vertical-align:top;position:relative;top:.2em}
.buy{font:700 12px var(--sans);color:#fff;border:0;cursor:pointer;padding:12px 26px;border-radius:5px;background:linear-gradient(90deg,var(--orange),var(--pink));box-shadow:0 10px 18px -6px rgba(236,91,140,.7);transition:transform .15s}
.buy:hover{transform:translateY(-1px)}
.dots{position:absolute;left:20px;top:58%;display:flex;flex-direction:column;gap:8px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(122,46,63,.25)}
.dots i:first-child{background:var(--white)}
.down{position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);width:50px;height:50px;border-radius:50%;border:1px solid rgba(255,255,255,.8);background:rgba(249,196,205,.9);display:grid;place-items:center;cursor:pointer;color:var(--white)}
.leaf{position:absolute;right:120px;top:130px;width:110px;opacity:.22}
.petal{position:absolute;z-index:3;pointer-events:none;filter:drop-shadow(0 10px 12px rgba(150,50,80,.25))}
.p1{top:-100px;right:14%;width:110px;animation:drift 9s ease-in-out infinite alternate}
.p2{top:-40px;left:30%;width:78px;animation:drift 11s ease-in-out infinite alternate-reverse}
.p3{bottom:-90px;right:-40px;width:150px;animation:drift 10s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateY(0) rotate(0)}to{transform:translateY(14px) rotate(9deg)}}
@media (prefers-reduced-motion:reduce){.petal{animation:none}}
@media (max-width:760px){
  .card{padding:20px 20px 60px}
  nav{gap:16px}nav a{display:none}
  .hero{grid-template-columns:1fr}
  .art{height:360px;margin:0}
  .art .bq{height:380px;left:50%;transform:translateX(-50%);bottom:-40px}
  .date{left:8px;top:90px;font-size:64px}
  .copy{padding:20px 0 0}
  .leaf,.dots{display:none}
  .p1{width:80px;top:-70px}.p3{width:100px;right:-20px}
}
</style>
</head>
<body>
<div class="stage">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbd3dc"/><stop offset=".55" stop-color="#f28fb0"/><stop offset="1" stop-color="#ee7ba3"/></linearGradient>
      <linearGradient id="pg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde6ea"/><stop offset="1" stop-color="#f39ab6"/></linearGradient>
      <symbol id="t" viewBox="0 0 60 80">
        <path d="M30 76C4 72-2 40 6 10c12 8 21 18 24 32z" fill="url(#pg2)"/>
        <path d="M30 76c26-4 32-36 24-66-12 8-21 18-24 32z" fill="url(#pg)"/>
        <path d="M30 78C12 68 12 30 30 4c18 26 18 64 0 74z" fill="url(#pg2)" opacity=".95"/>
      </symbol>
      <symbol id="pt" viewBox="0 0 100 70"><path d="M4 30C10 6 60-6 96 14c-4 30-40 56-78 52C8 60 2 44 4 30z" fill="url(#pg2)"/><path d="M4 30C30 34 60 30 96 14" stroke="#f39ab6" stroke-width="1.2" fill="none" opacity=".6"/></symbol>
    </defs>
  </svg>

  <svg class="petal p1" viewBox="0 0 100 70" aria-hidden="true"><use href="#pt"/></svg>
  <svg class="petal p2" viewBox="0 0 100 70" aria-hidden="true" style="transform:rotate(-20deg)"><use href="#pt"/></svg>
  <svg class="petal p3" viewBox="0 0 100 70" aria-hidden="true"><use href="#pt"/></svg>

  <main class="card">
    <nav aria-label="Menu utama">
      <span class="logo"><i></i>radinkacraft</span>
      <a href="#toko">Toko</a><a href="#tentang">Tentang</a><a href="#kontak">Kontak</a>
      <span class="cart" role="img" aria-label="Keranjang"><b></b></span>
      <span class="burger" role="img" aria-label="Menu"></span>
    </nav>

    <section class="hero">
      <div class="art">
        <img class="bq" src="../public/images/hero-bouquet.png" alt="Bucket bunga tulip pink segar" width="480" height="701">
        <h2 class="date" aria-label="21 Maret">21<sup>st</sup><span>March</span></h2>
      </div>

      <div class="copy">
        <svg class="leaf" viewBox="0 0 100 120" aria-hidden="true"><g fill="#fff"><path d="M50 118V30" stroke="#fff" stroke-width="2"/><path d="M50 30c-14-4-18-16-14-26 12 4 16 14 14 26zM50 55c16-2 26-12 28-24-14 0-26 8-28 24zM50 70c-16-2-28-12-30-26 16 0 28 10 30 26zM50 95c16-2 28-12 32-26-16 0-30 10-32 26z"/></g></svg>
        <h1>Berikan sedikit musim semi</h1>
        <p>Tulip adalah bunga musim semi yang mekar dengan kelopak besar dan cerah, umumnya berwarna merah, merah muda, kuning, atau putih. Kami merangkainya segar setiap hari dan mengirimnya rapi ke pintu penerima.</p>
        <div class="sizes" role="group" aria-label="Ukuran bucket">
          <button aria-pressed="false">S</button><button aria-pressed="true">M</button><button aria-pressed="false">L</button><button aria-pressed="false">XL</button>
        </div>
        <div class="buybar">
          <span class="price"><small>Rp</small> 149<small>.000</small></span>
          <button class="buy">Pesan sekarang</button>
        </div>
      </div>
    </section>

    <div class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <button class="down" aria-label="Lihat produk"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 5l5 5 5-5"/></svg></button>
  </main>
</div>
<script>
document.querySelectorAll('.sizes button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.sizes button').forEach(x=>x.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed','true');
}));
</script>
</body>
</html>
